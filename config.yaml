# AI-Orchestra Configuration
# AI角色与API配置

# OpenAI兼容接口配置（适用于DeepSeek等）
api_keys:
  deepseek:
    api_key: ""  # DeepSeek API Key
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-chat"
  
  doubao:
    api_key: ""  # 豆包/火山引擎 API Key
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    model: "ep-2025xxxxxx"  # 你的endpoint id
  
  qwen:
    api_key: ""  # 通义千问 API Key
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen-max"
  
  yuanbao:
    api_key: ""  # 腾讯混元/元宝 API Key
    base_url: "https://hunyuan.tencentcloudapi.com"
    model: "hunyuan-pro"
  
  kimi:
    api_key: ""  # Moonshot API Key
    base_url: "https://api.moonshot.cn/v1"
    model: "moonshot-v1-8k"
  
  # 更多AI可以在这里添加...
  gpt4:
    api_key: ""  # OpenAI API Key
    base_url: "https://api.openai.com/v1"
    model: "gpt-4"
  
  claude:
    api_key: ""  # Anthropic API Key
    base_url: "https://api.anthropic.com/v1"
    model: "claude-3-opus-20240229"

# ==================== 角色配置 ====================
# 三级决策模式角色分配
hierarchy_mode:
  students:  # 学生组 - 6个AI同时回答
    - deepseek
    - doubao
    - qwen
    - yuanbao
    - kimi
    - gpt4
  
  teachers:  # 老师组 - 3个AI评判
    - claude
    - qwen
    - deepseek
  
  principal:  # 校长 - 1个AI最终决策
    - claude

# 狼人杀模式角色分配
werewolf_mode:
  total_players: 10
  roles:
    judge: claude      # 法官
    werewolf_1: deepseek   # 狼人1
    werewolf_2: doubao     # 狼人2
    prophet: qwen          # 预言家
    witch: yuanbao         # 女巫
    civilian_1: kimi       # 平民1
    civilian_2: gpt4       # 平民2
    civilian_3: claude     # 平民3
    civilian_4: deepseek   # 平民4
    civilian_5: doubao     # 平民5

# 性格配置
personalities:
  aggressive:    # 激进型 - 喜欢反驳，逻辑硬核
    traits: ["直接", "批判性", "简短有力"]
    speak_style: " aggressive"
  
  cautious:      # 谨慎型 - 滴水不漏
    traits: ["谨慎", "周全", "留有余地"]
    speak_style: " cautious"
  
  humorous:      # 幽默型 - 爱说烂梗
    traits: ["幽默", "轻松", "善于比喻"]
    speak_style: " humorous"
  
  analytical:    # 学霸型 - 列提纲引用数据
    traits: ["严谨", "结构化", "数据驱动"]
    speak_style: " analytical"
  
  mediator:      # 和事佬 - 倾向平衡
    traits: ["温和", "平衡", "求同存异"]
    speak_style: " mediator"

# 全局设置
settings:
  mock_mode: true  # 无API Key时使用模拟模式
  max_tokens: 2048
  temperature: 0.7
  request_timeout: 30
  parallel_requests: true  # 是否并行请求
